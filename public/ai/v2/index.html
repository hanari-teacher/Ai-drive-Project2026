<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI対話アプリ V2</title>
  <style>
    :root {
      --bg-body: #f3f4f6;
      --bg-panel: #ffffff;
      --bg-sidebar: #f9fafb;
      --border-color: #d1d5db;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --text-main: #111827;
      --text-muted: #6b7280;
      --user-bg: #dbeafe;
      --model-bg: #f3f4f6;
      --danger-bg: #fef2f2;
      --danger-border: #fca5a5;
      --danger-text: #b91c1c;
      --warn-bg: #fffbeb;
      --warn-border: #fcd34d;
      --warn-text: #92400e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      color: var(--text-main);
      background-color: var(--bg-body);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ヘッダー */
    header {
      background-color: #1e293b;
      color: #ffffff;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    header h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 600;
    }

    header .header-links a {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 0.85rem;
      margin-left: 16px;
    }

    header .header-links a:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    /* 公開停止バナー */
    .disabled-banner {
      display: none;
      background-color: var(--warn-bg);
      border-bottom: 1px solid var(--warn-border);
      color: var(--warn-text);
      padding: 10px 20px;
      font-size: 0.9rem;
      font-weight: 600;
      flex-shrink: 0;
    }

    .disabled-banner.visible {
      display: block;
    }

    /* メイン2ペインレイアウト */
    .app-container {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* 左ペイン：会話作成・一覧 */
    .sidebar {
      width: 300px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .new-conversation-box {
      padding: 14px;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-panel);
    }

    .new-conversation-box label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    .new-conversation-box input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    .new-conversation-box button {
      width: 100%;
      padding: 8px 12px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .new-conversation-box button:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .new-conversation-box button:disabled,
    .new-conversation-box input:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .sidebar-section-title {
      padding: 10px 14px 6px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.03em;
    }

    .conversation-list {
      list-style: none;
      margin: 0;
      padding: 4px 8px 16px;
      overflow-y: auto;
      flex: 1;
    }

    .conversation-item {
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 4px;
      border: 1px solid transparent;
      transition: background-color 0.15s;
    }

    .conversation-item:hover {
      background-color: #e5e7eb;
    }

    .conversation-item.active {
      background-color: var(--primary-light);
      border-color: #93c5fd;
      font-weight: 600;
    }

    .conversation-item-title {
      font-size: 0.92rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conversation-item-date {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* 右ペイン：対話エリア */
    .main-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-panel);
      min-width: 0;
    }

    .chat-header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-panel);
      flex-shrink: 0;
    }

    .chat-header h2 {
      margin: 0;
      font-size: 1.05rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* エラー通知バー */
    .error-box {
      display: none;
      margin: 10px 20px 0;
      padding: 10px 14px;
      background-color: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger-text);
      border-radius: 6px;
      font-size: 0.88rem;
      flex-shrink: 0;
    }

    .error-box.visible {
      display: block;
    }

    /* メッセージ表示領域 */
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* 過去履歴追加読み込みバー */
    .load-more-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      background-color: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .load-more-bar.visible {
      display: flex;
    }

    .load-more-bar button {
      padding: 6px 12px;
      background-color: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.83rem;
      font-weight: 600;
      cursor: pointer;
    }

    .load-more-bar button:hover:not(:disabled) {
      background-color: #f1f5f9;
    }

    /* 1往復（ターン）カード */
    .turn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-bottom: 12px;
      border-bottom: 1px dashed #e5e7eb;
    }

    .message-bubble {
      padding: 10px 14px;
      border-radius: 8px;
      line-height: 1.6;
      font-size: 0.93rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message-role {
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text-muted);
    }

    .message-user {
      background-color: var(--user-bg);
      align-self: flex-end;
      max-width: 82%;
    }

    .message-model {
      background-color: var(--model-bg);
      align-self: flex-start;
      max-width: 88%;
    }

    /* 質問送信フォーム */
    .composer {
      border-top: 1px solid var(--border-color);
      padding: 12px 20px;
      background-color: var(--bg-sidebar);
      flex-shrink: 0;
    }

    .composer textarea {
      width: 100%;
      min-height: 76px;
      max-height: 180px;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.93rem;
      resize: vertical;
    }

    .composer textarea:disabled {
      background-color: #e5e7eb;
      cursor: not-allowed;
    }

    .composer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
    }

    .composer-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .loading-text {
      display: none;
      color: var(--primary);
      font-weight: 600;
    }

    .loading-text.visible {
      display: inline;
    }

    .composer button {
      padding: 8px 20px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
    }

    .composer button:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .composer button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    @media (max-width: 768px) {
      .app-container {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        max-height: 36vh;
        border-right: none;
        border-bottom: 1px solid var(--border-color);
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>AI対話アプリ V2</h1>
    <div class="header-links">
      <a href="/ai/">V1画面へ</a>
      <a href="/">TOPへ</a>
    </div>
  </header>

  <div id="disabledBanner" class="disabled-banner">
    現在、公開停止設定により新規会話の作成および質問の送信を停止しています（過去の履歴閲覧のみ可能）。
  </div>

  <div class="app-container">
    <!-- 左ペイン -->
    <aside class="sidebar">
      <form id="newConversationForm" class="new-conversation-box">
        <label for="newTitleInput">新しい会話（最大100文字）</label>
        <input
          id="newTitleInput"
          type="text"
          maxlength="100"
          placeholder="新しい会話のタイトルを入力"
          autocomplete="off"
        />
        <button id="createConversationBtn" type="submit">＋ 新規会話作成</button>
      </form>

      <div class="sidebar-section-title">会話一覧</div>
      <ul id="conversationList" class="conversation-list"></ul>
    </aside>

    <!-- 右ペイン -->
    <main class="main-pane">
      <div class="chat-header">
        <h2 id="currentConversationTitle">会話が選択されていません</h2>
      </div>

      <div id="errorBox" class="error-box" role="alert"></div>

      <div id="messagesContainer" class="messages-container">
        <div id="loadMoreBar" class="load-more-bar">
          <span>過去の履歴が存在します</span>
          <button id="loadMoreBtn" type="button">過去の履歴をさらに表示（20件）</button>
        </div>

        <div id="emptyState" class="empty-state">
          左のメニューから会話を選択するか、新しい会話を作成してください。
        </div>

        <div id="turnsList"></div>
      </div>

      <form id="askForm" class="composer">
        <textarea
          id="promptInput"
          maxlength="1500"
          placeholder="選択中の会話に質問を入力してください（最大1,500文字）"
          disabled
        ></textarea>
        <div class="composer-footer">
          <div class="composer-meta">
            <span id="charCounter">0 / 1500</span>
            <span id="loadingIndicator" class="loading-text">AIが回答を生成中...</span>
          </div>
          <button id="sendBtn" type="submit" disabled>送信</button>
        </div>
      </form>
    </main>
  </div>

  <script>
    const API_BASE = '/api/ai/v2';
    const PAGE_SIZE = 20;

    // アプリケーション状態
    const state = {
      aiDisabled: false,
      conversations: [],
      selectedConversationId: null,
      turns: [],
      hasMore: false,
      isSubmitting: false,
      isLoadingMore: false,
    };

    // DOM要素参照
    const disabledBanner = document.getElementById('disabledBanner');
    const newConversationForm = document.getElementById('newConversationForm');
    const newTitleInput = document.getElementById('newTitleInput');
    const createConversationBtn = document.getElementById('createConversationBtn');
    const conversationList = document.getElementById('conversationList');
    const currentConversationTitle = document.getElementById('currentConversationTitle');
    const errorBox = document.getElementById('errorBox');
    const messagesContainer = document.getElementById('messagesContainer');
    const loadMoreBar = document.getElementById('loadMoreBar');
    const loadMoreBtn = document.getElementById('loadMoreBtn');
    const emptyState = document.getElementById('emptyState');
    const turnsList = document.getElementById('turnsList');
    const askForm = document.getElementById('askForm');
    const promptInput = document.getElementById('promptInput');
    const charCounter = document.getElementById('charCounter');
    const loadingIndicator = document.getElementById('loadingIndicator');
    const sendBtn = document.getElementById('sendBtn');

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.add('visible');
    }

    function clearError() {
      errorBox.textContent = '';
      errorBox.classList.remove('visible');
    }

    function formatDate(isoString) {
      if (!isoString) return '';
      const d = new Date(isoString);
      return d.toLocaleString('ja-JP', {
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
      });
    }

    function syncControlStates() {
      // 公開停止バナーと新規会話作成欄
      if (state.aiDisabled) {
        disabledBanner.classList.add('visible');
        newTitleInput.disabled = true;
        createConversationBtn.disabled = true;
      } else {
        disabledBanner.classList.remove('visible');
        newTitleInput.disabled = state.isSubmitting;
        createConversationBtn.disabled = state.isSubmitting;
      }

      // 質問送信フォーム
      const canAsk =
        !state.aiDisabled &&
        state.selectedConversationId !== null &&
        !state.isSubmitting;

      promptInput.disabled = !canAsk;
      sendBtn.disabled = !canAsk;
      loadingIndicator.classList.toggle('visible', state.isSubmitting);
      loadMoreBtn.disabled = state.isLoadingMore;
    }

    function renderConversationList() {
      conversationList.innerHTML = '';

      if (state.conversations.length === 0) {
        const li = document.createElement('li');
        li.style.padding = '12px';
        li.style.fontSize = '0.85rem';
        li.style.color = '#6b7280';
        li.textContent = '会話はまだありません。';
        conversationList.appendChild(li);
        return;
      }

      for (const conv of state.conversations) {
        const li = document.createElement('li');
        li.className = 'conversation-item' + (conv.id === state.selectedConversationId ? ' active' : '');

        const titleEl = document.createElement('div');
        titleEl.className = 'conversation-item-title';
        titleEl.textContent = conv.title;

        const dateEl = document.createElement('div');
        dateEl.className = 'conversation-item-date';
        dateEl.textContent = `更新: ${formatDate(conv.updatedAt)}`;

        li.appendChild(titleEl);
        li.appendChild(dateEl);

        li.addEventListener('click', () => {
          if (state.isSubmitting) return;
          selectConversation(conv.id);
        });

        conversationList.appendChild(li);
      }
    }

    function createTurnElement(turn) {
      const group = document.createElement('div');
      group.className = 'turn-group';

      // Userメッセージ
      const userBubble = document.createElement('div');
      userBubble.className = 'message-bubble message-user';
      const userRole = document.createElement('div');
      userRole.className = 'message-role';
      userRole.textContent = `あなた (${formatDate(turn.createdAt)})`;
      const userText = document.createElement('div');
      userText.textContent = turn.userMessage;
      userBubble.appendChild(userRole);
      userBubble.appendChild(userText);

      // Modelメッセージ
      const modelBubble = document.createElement('div');
      modelBubble.className = 'message-bubble message-model';
      const modelRole = document.createElement('div');
      modelRole.className = 'message-role';
      modelRole.textContent = 'Gemini AI';
      const modelText = document.createElement('div');
      modelText.textContent = turn.modelMessage;
      modelBubble.appendChild(modelRole);
      modelBubble.appendChild(modelText);

      group.appendChild(userBubble);
      group.appendChild(modelBubble);
      return group;
    }

    function renderTurns(scrollToBottom = false) {
      loadMoreBar.classList.toggle('visible', state.hasMore);

      if (state.selectedConversationId === null) {
        emptyState.style.display = 'block';
        emptyState.textContent = '左のメニューから会話を選択するか、新しい会話を作成してください。';
        turnsList.innerHTML = '';
        return;
      }

      if (state.turns.length === 0) {
        emptyState.style.display = 'block';
        emptyState.textContent = 'まだメッセージがありません。下の入力欄から最初の質問を送信してください。';
        turnsList.innerHTML = '';
        return;
      }

      emptyState.style.display = 'none';
      turnsList.innerHTML = '';
      for (const turn of state.turns) {
        turnsList.appendChild(createTurnElement(turn));
      }

      if (scrollToBottom) {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }
    }

    // 会話一覧の取得
    async function loadConversations(preserveSelection = true) {
      try {
        const res = await fetch(`${API_BASE}/conversations`);
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || '会話一覧の取得に失敗しました。');
        }

        state.aiDisabled = Boolean(data.aiDisabled);
        state.conversations = Array.isArray(data.conversations) ? data.conversations : [];
        renderConversationList();
        syncControlStates();

        if (!preserveSelection) {
          state.selectedConversationId = null;
        }
      } catch (err) {
        showError(err.message || '会話一覧の読み込み中にエラーが発生しました。');
      }
    }

    // 会話選択と初期20往復履歴の取得
    async function selectConversation(conversationId) {
      clearError();
      state.selectedConversationId = conversationId;
      state.turns = [];
      state.hasMore = false;

      const targetConv = state.conversations.find((c) => c.id === conversationId);
      currentConversationTitle.textContent = targetConv ? targetConv.title : '会話';

      renderConversationList();
      renderTurns(false);
      syncControlStates();

      try {
        const res = await fetch(
          `${API_BASE}/conversations/${conversationId}/turns?limit=${PAGE_SIZE}&offset=0`
        );
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || '会話履歴の取得に失敗しました。');
        }

        if (data.conversation?.title) {
          currentConversationTitle.textContent = data.conversation.title;
        }
        state.turns = Array.isArray(data.turns) ? data.turns : [];
        state.hasMore = Boolean(data.hasMore);
        renderTurns(true);
      } catch (err) {
        showError(err.message || '会話履歴の読み込み中にエラーが発生しました。');
      }
    }

    // 過去履歴の20件追加読み込み
    loadMoreBtn.addEventListener('click', async () => {
      if (state.selectedConversationId === null || state.isLoadingMore || !state.hasMore) {
        return;
      }

      clearError();
      state.isLoadingMore = true;
      syncControlStates();

      const prevScrollHeight = messagesContainer.scrollHeight;
      const offset = state.turns.length;

      try {
        const res = await fetch(
          `${API_BASE}/conversations/${state.selectedConversationId}/turns?limit=${PAGE_SIZE}&offset=${offset}`
        );
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || '過去の履歴取得に失敗しました。');
        }

        const olderTurns = Array.isArray(data.turns) ? data.turns : [];
        state.turns = [...olderTurns, ...state.turns];
        state.hasMore = Boolean(data.hasMore);
        renderTurns(false);

        // 追加読み込み後も閲覧位置が大きくズレないようスクロール位置を補正
        const newScrollHeight = messagesContainer.scrollHeight;
        messagesContainer.scrollTop += newScrollHeight - prevScrollHeight;
      } catch (err) {
        showError(err.message || '過去の履歴取得中にエラーが発生しました。');
      } finally {
        state.isLoadingMore = false;
        syncControlStates();
      }
    });

    // 新規会話作成フォーム送信
    newConversationForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();

      const title = newTitleInput.value.trim();
      if (!title) {
        showError('会話タイトルを入力してください。');
        return;
      }
      if (title.length > 100) {
        showError('会話タイトルは100文字以内で入力してください。');
        return;
      }

      createConversationBtn.disabled = true;
      newTitleInput.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/conversations`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title }),
        });
        const data = await res.json();

        if (res.status === 503 || data.aiDisabled) {
          state.aiDisabled = true;
          syncControlStates();
          throw new Error(data.error || '現在、新規会話の作成は停止されています。');
        }

        if (!res.ok) {
          throw new Error(data.error || '新規会話の作成に失敗しました。');
        }

        newTitleInput.value = '';
        const created = data.conversation;
        state.conversations = [created, ...state.conversations];
        await selectConversation(created.id);
      } catch (err) {
        showError(err.message || '新規会話の作成中にエラーが発生しました。');
      } finally {
        syncControlStates();
      }
    });

    // 文字数カウンタ更新
    promptInput.addEventListener('input', () => {
      charCounter.textContent = `${promptInput.value.length} / 1500`;
    });

    // Ctrl+Enter / Cmd+Enter で送信
    promptInput.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        askForm.requestSubmit();
      }
    });

    // 質問送信フォーム
    askForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (state.selectedConversationId === null || state.isSubmitting) return;

      clearError();
      const rawPrompt = promptInput.value;
      const trimmedPrompt = rawPrompt.trim();

      if (!trimmedPrompt) {
        showError('質問文を入力してください。');
        return;
      }
      if (trimmedPrompt.length > 1500) {
        showError('質問文は1,500文字以内で入力してください。');
        return;
      }

      state.isSubmitting = true;
      syncControlStates();

      try {
        const res = await fetch(
          `${API_BASE}/conversations/${state.selectedConversationId}/turns`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: trimmedPrompt }),
          }
        );
        const data = await res.json();

        if (res.status === 503 || data.aiDisabled) {
          state.aiDisabled = true;
          throw new Error(data.error || '現在、質問の送信は停止されています。');
        }

        if (!res.ok) {
          throw new Error(data.error || '質問の送信に失敗しました。');
        }

        // 成功時のみ入力欄をクリア
        promptInput.value = '';
        charCounter.textContent = '0 / 1500';

        if (data.turn) {
          state.turns.push(data.turn);
          renderTurns(true);
        }

        // 会話一覧の並び順（updatedAt）を最新化
        await loadConversations(true);
        renderConversationList();
      } catch (err) {
        // 失敗時は promptInput.value をクリアせずそのまま保持する
        showError(err.message || 'AIからの応答取得に失敗しました。時間をおいて再送信してください。');
      } finally {
        state.isSubmitting = false;
        syncControlStates();
        if (!promptInput.disabled) {
          promptInput.focus();
        }
      }
    });

    // 初期起動処理
    (async function init() {
      await loadConversations(false);
    })();
  </script>
</body>
</html>
